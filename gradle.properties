# A permanent placeholder, never bumped. The version IS the git tag: the release passes
# `-Pversion=X.Y.Z` on the publish command, Gradle writes that into the jar manifest and into a
# generated `version.properties` resource, and `Version.current()` reads it back for the User-Agent. Nothing is committed on release, so a
# checkout builds `0.0.0` and a published artifact carries the real version. See .rules/RELEASE.md.
version=0.0.0

org.gradle.caching=true
org.gradle.parallel=true
